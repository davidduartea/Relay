packages:
  - "apps/*"
  - "packages/*"
  # Los E2E van fuera de apps/ y de packages/ a propósito: no son una
  # aplicación ni una librería que alguien consuma, sino una suite que ejercita
  # a las dos por fuera, sin importar su código.
  - "e2e"

# ─── Política de cadena de suministro ────────────────────────────────────────
# Deny-by-default: pnpm no ejecuta scripts de instalación salvo que se marquen
# aquí explícitamente. Un paquete comprometido normalmente entrega su payload
# desde un postinstall, así que negarlos por defecto cierra esa vía.
allowBuilds:
  # Descarga los binarios del query engine, que son específicos de cada
  # plataforma y por eso no pueden venir dentro del tarball. Sin este script
  # Prisma no tiene con qué hablarle a Postgres. Es la única excepción real.
  "@prisma/engines": true

  # Su postinstall sólo ejecuta `prisma generate`. Lo corremos nosotros desde
  # el script `db:generate`, que además queda encadenado al build: la
  # generación pasa a ser un paso visible del pipeline en vez de un efecto
  # secundario silencioso de `pnpm install`.
  "@prisma/client": false
  prisma: false

  "@swc/core": false
  esbuild: false
  sharp: false
  unrs-resolver: false

# La instalación FALLA (no solo avisa) si aparece una dependencia con scripts
# sin revisar. Convierte el CI en un bloqueo automático ante un paquete nuevo.
strictDepBuilds: true

# Rechaza versiones publicadas hace menos de 24h. La mayoría de los paquetes
# comprometidos se retiran del registro en horas; esta ventana los evita.
minimumReleaseAge: 1440

# Versiones mínimas que cierran avisos de `pnpm audit` en dependencias
# transitivas que no declaramos y que, por tanto, no podemos subir de otra
# forma que no sea forzándolas aquí.
overrides:
  # GHSA-ggr8-5vv4-36mx (high): agotamiento de pila al fusionar grafos de
  # objetos recursivos. Llega por @prisma/config, así que actualizar Prisma no
  # lo arregla: la única vía es forzar la versión parcheada.
  deepmerge-ts: ^8.0.0
