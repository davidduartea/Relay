###############################################################################
# Por defecto sólo levanta Postgres, que es lo que el desarrollo necesita:
#
#   docker compose up -d          → sólo la base (equivale a `pnpm db:up`)
#   docker compose --profile full up -d --build
#                                 → la pila entera en contenedores
#
# El perfil existe para que `pnpm db:up` siga haciendo lo de siempre. Sin él,
# arrancaría también API y web, y el flujo de desarrollo con `pnpm dev` —
# recarga en caliente incluida — se perdería.
###############################################################################

services:
  postgres:
    image: postgres:17-alpine
    container_name: relay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      # Sólo en la interfaz local. Sin el prefijo `127.0.0.1`, Docker publica
      # el puerto en TODAS las interfaces de red de la máquina: en una wifi
      # compartida, cualquiera podría conectarse a esta base probando la
      # credencial por defecto — que está a la vista en este mismo archivo.
      #
      # Nada de lo que la usa viene de fuera: la API la alcanza por la red
      # interna de compose, y `pnpm db:studio` corre en la propia máquina.
      - "127.0.0.1:5432:5432"
    volumes:
      - relay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: relay-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # `postgres` es el nombre del servicio: dentro de la red de compose, el
      # DNS lo resuelve. `localhost` apuntaría al propio contenedor de la API.
      DATABASE_URL: postgresql://relay:relay@postgres:5432/relay?schema=public
      WEB_ORIGIN: http://localhost:3000
      # Sin `:?` a propósito, aunque sean obligatorias: compose interpola
      # TODOS los servicios aunque sólo se arranque uno, así que esa forma
      # haría fallar `docker compose up -d` — el que levanta sólo Postgres y
      # el que usa `pnpm db:up` a diario — por unos secretos que ese comando
      # no necesita.
      #
      # Que falten no pasa desapercibido: el esquema de Zod de la API los
      # exige con 32 caracteres mínimo y tumba el contenedor al arrancar,
      # nombrando la variable que falta.
      # El `:-` declara la cadena vacía como valor por defecto. Sin él,
      # compose avisa en cada `docker compose up` de que la variable no está,
      # incluso al levantar sólo Postgres.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
    ports:
      - "4000:4000"
    depends_on:
      # No basta con que el contenedor exista: se espera a que Postgres
      # responda, o la primera migración fallaría contra una base que aún
      # está arrancando.
      postgres:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # También como argumento de build: la CSP se genera al compilar y su
        # `connect-src` tiene que listar el origen del socket. Este valor y el
        # del entorno tienen que coincidir, o el navegador bloquea la conexión
        # sin decir nada.
        API_URL: http://localhost:4000
    container_name: relay-web
    restart: unless-stopped
    environment:
      # La dirección que se le entrega al navegador para abrir el socket: la
      # que él alcanza, es decir el puerto publicado en la máquina anfitriona.
      API_URL: http://localhost:4000
      # La que usa el servidor de Next para hablar con el API. Comparten red,
      # así que va por el nombre del servicio en vez de salir y volver.
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  relay-pgdata:
