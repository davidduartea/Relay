name: Keep alive

# Mantiene despiertos los dos servicios del despliegue gratuito.
#
# Render duerme el servicio a los 15 minutos sin peticiones y tarda cerca de un
# minuto en volver. Supabase pausa el proyecto entero tras una semana sin
# actividad y ése no vuelve solo: hay que restaurarlo a mano desde su panel.
#
# Se llama a **/rooms**, no a /healthz. La comprobación de salud está hecha a
# propósito para no tocar la base — así una degradación de Postgres no provoca
# reinicios del contenedor —, de modo que despertaría a Render y dejaría que
# Supabase se durmiera igual. `/rooms` sí consulta, es público y no cambia nada.
#
# Sólo hace algo si existe la variable `API_KEEPALIVE_URL`. En un repositorio sin
# desplegar, o desplegado en Railway, el job termina sin tocar nada.

on:
  schedule:
    # Cada diez minutos. GitHub no garantiza la puntualidad de los crones y
    # puede retrasarlos con carga alta, así que se pide más a menudo que los 15
    # minutos que tarda Render en dormirse.
    - cron: "*/10 * * * *"

  # Para poder probarlo sin esperar al siguiente hueco.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Despertar el API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comprobar que hay una URL configurada
        id: check
        run: |
          if [ -z "${{ vars.API_KEEPALIVE_URL }}" ]; then
            echo "Sin API_KEEPALIVE_URL: no hay nada desplegado que mantener despierto."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Llamar al API
        if: steps.check.outputs.configured == 'true'
        run: |
          # --max-time 90 porque un servicio dormido tarda cerca de un minuto
          # en levantar, y ésa es justamente la petición que lo despierta.
          #
          # --retry 2 con espera porque el primer intento contra un servicio
          # frío puede cortarse antes de que termine de arrancar.
          curl --fail --silent --show-error \
               --max-time 90 --retry 2 --retry-delay 30 \
               "${{ vars.API_KEEPALIVE_URL }}"
          echo
