name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile hace que el CI falle si el lockfile no corresponde al
      # package.json, en vez de resolver versiones nuevas en silencio. Es la
      # mitad de la política de supply chain; la otra mitad vive en
      # pnpm-workspace.yaml (deny-by-default y minimumReleaseAge).
      - name: Install
        run: pnpm install --frozen-lockfile

      # El paquete compartido se construye primero: los dos apps lo consumen
      # desde dist/ para typecheck y build.
      - name: Build shared package
        run: pnpm --filter @relay/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Se ejecuta como job aparte para que un aviso nuevo del registro no
      # bloquee un PR que no tocó dependencias: se ve rojo, se atiende, pero no
      # frena el trabajo de otra persona.
      - name: Audit
        run: pnpm audit --audit-level moderate
