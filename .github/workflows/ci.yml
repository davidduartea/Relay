name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile hace que el CI falle si el lockfile no corresponde al
      # package.json, en vez de resolver versiones nuevas en silencio. Es la
      # mitad de la política de supply chain; la otra mitad vive en
      # pnpm-workspace.yaml (deny-by-default y minimumReleaseAge).
      - name: Install
        run: pnpm install --frozen-lockfile

      # El paquete compartido se construye primero: los dos apps lo consumen
      # desde dist/ para typecheck y build.
      - name: Build shared package
        run: pnpm --filter @relay/shared build

      # El postinstall de @prisma/client está bloqueado por la política de
      # supply chain, así que la generación del cliente es un paso explícito.
      # Va antes de typecheck porque los tipos de las tablas salen de aquí.
      - name: Generate Prisma client
        run: pnpm --filter @relay/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      # `next build` compila en modo producción, y ahí API_URL es obligatoria a
      # propósito: sin ella la aplicación apuntaría a localhost sin avisar. La
      # necesita el build porque la CSP se genera al compilar y tiene que
      # listar el origen del socket en `connect-src`.
      #
      # El valor es un marcador, no un destino: `.invalid` es un TLD reservado
      # (RFC 2606) que nunca resuelve. Este job comprueba que el proyecto
      # compila; el valor real lo pone la plataforma de despliegue.
      - name: Build
        run: pnpm build
        env:
          API_URL: https://api.relay.invalid

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres de verdad: los E2E ejercitan la persistencia, y contra una base
    # falsa no probarían ni el historial ni la idempotencia.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://relay:relay@localhost:5432/relay
      # Sin pooler delante es la misma cadena, pero el esquema declara
      # `directUrl` y Prisma la exige igual.
      DIRECT_URL: postgresql://relay:relay@localhost:5432/relay
      JWT_ACCESS_SECRET: ci-access-secret-de-al-menos-32-caracteres
      JWT_REFRESH_SECRET: ci-refresh-secret-distinto-de-32-caracteres
      WEB_ORIGIN: http://localhost:3000
      API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @relay/shared build

      # Sólo Chromium: los tres navegadores triplican el tiempo del pipeline
      # para cubrir diferencias que este proyecto no ejercita. --with-deps trae
      # las librerías de sistema que Chromium necesita en el runner.
      - name: Install Chromium
        run: pnpm --filter @relay/e2e exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm --filter @relay/api exec prisma migrate deploy

      - name: Seed
        run: pnpm db:seed

      - name: Build
        run: pnpm build

      - name: Run end-to-end tests
        run: pnpm e2e

      # El reporte se sube siempre, no sólo al fallar: en un fallo trae la
      # traza y el vídeo, que es la única forma de entender un test rojo en un
      # runner al que nadie puede asomarse.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Se ejecuta como job aparte para que un aviso nuevo del registro no
      # bloquee un PR que no tocó dependencias: se ve rojo, se atiende, pero no
      # frena el trabajo de otra persona.
      - name: Audit
        run: pnpm audit --audit-level moderate
